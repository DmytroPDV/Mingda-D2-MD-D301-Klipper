# This file contains common pin mappings for the Mingda D2 (230x230x260)
# with the MD D301 V1.0 motherboard (STM32F103ZET6) and TMC2208 UART drivers.
#
# To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader" and USB communication
# (or USART3 PB11/PB10 if connecting via serial).
# In "make menuconfig":
#   [*] Enable extra low-level configuration options
#   Micro-controller Architecture (STMicroelectronics STM32) --->
#   Processor model (STM32F103) --->
#   Bootloader offset (28KiB bootloader) --->
#   Clock Reference (8 MHz crystal) --->
#   Communication interface (USB (on PA11/PA12)) --->
#   (PA15) USB ids / GPIO pins to set at micro-controller startup (optional)
#
# After running "make", copy the generated "out/klipper.bin" file to an
# SD card and rename it to "firmware.bin". Turn on the printer with the
# SD card inserted to flash the board.

[include mainsail.cfg]

[force_move]
enable_force_move: True

[exclude_object]

[gcode_arcs]
resolution: 0.1

[mcu]
serial: /dev/ttyACM0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 800
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

# ======================================================================
# SYSTEM TEMPERATURE SENSORS
# ======================================================================

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor host_temp]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

# ======================================================================
# STEPPER MOTORS & TMC2208 UART DRIVERS
# ======================================================================

[stepper_x]
step_pin: PD2
dir_pin: PC10
enable_pin: !PD3
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PF12
position_endstop: 0
position_max: 230
homing_speed: 50

[tmc2208 stepper_x]
uart_pin: PD6
run_current: 0.580
hold_current: 0.290
sense_resistor: 0.110
stealthchop_threshold: 999999
interpolate: True

[stepper_y]
step_pin: PA10
dir_pin: PA9
enable_pin: !PC12
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PF14
position_endstop: 0
position_max: 230
homing_speed: 50

[tmc2208 stepper_y]
uart_pin: PC11
run_current: 0.580
hold_current: 0.290
sense_resistor: 0.110
stealthchop_threshold: 999999
interpolate: True

[stepper_z]
step_pin: PG8
dir_pin: !PG7
enable_pin: !PC9
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -3.0
position_max: 250
homing_speed: 5

[tmc2208 stepper_z]
uart_pin: PA8
run_current: 0.580
hold_current: 0.290
sense_resistor: 0.110
stealthchop_threshold: 999999
interpolate: True

[stepper_z1]
step_pin: PG4
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 4

[tmc2208 stepper_z1]
uart_pin: PG6
run_current: 0.580
hold_current: 0.290
sense_resistor: 0.110
stealthchop_threshold: 999999
interpolate: True

# ======================================================================
# EXTRUDER & HEATED BED
# ======================================================================

[extruder]
step_pin: PD12
dir_pin: PD11
enable_pin: !PD13
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 600.0
pressure_advance: 0.045
pressure_advance_smooth_time: 0.040
heater_pin: PC6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 275

[tmc2208 extruder]
uart_pin: PG2
run_current: 0.600
hold_current: 0.300
sense_resistor: 0.110
stealthchop_threshold: 999999
interpolate: True

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 110

# ======================================================================
# FANS, SENSORS & BOARD PERIPHERALS
# ======================================================================

[fan]
pin: PC7
kick_start_time: 0.500
cycle_time: 0.00004
off_below: 0.15

[filament_switch_sensor runout_sensor]
switch_pin: ^PG1
pause_on_runout: True

[output_pin lcd_backlight]
pin: PG10
value: 0          # 0 = turn off stock FSMC TFT backlight by default, 1 = on
shutdown_value: 0

[output_pin beeper]
pin: PG11
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001

# Optional PSU control pin (uncomment if using relay module on PS_ON)
#[output_pin psu_on]
#pin: PA1
#value: 1
#shutdown_value: 0

# Optional Neopixel strip onPB9
#[neopixel board_neopixel]
#pin: PB9

# ======================================================================
# BLTOUCH, HOMING & BED LEVELING
# ======================================================================

[bltouch]
sensor_pin: PB1
control_pin: PB0
pin_move_time: 0.680
pin_up_touch_mode_reports_triggered: False
probe_with_touch_mode: True
stow_on_each_sample: False
x_offset: -40.0
y_offset: -10.0
z_offset: 0.800
speed: 4.0
samples: 1
sample_retract_dist: 5.0

[safe_z_home]
home_xy_position: 115, 115
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 50
horizontal_move_z: 6
mesh_min: 15, 20
mesh_max: 155, 185
probe_count: 4, 4
algorithm: bicubic
fade_start: 1
fade_end: 10

[z_tilt]
z_positions:
    265, 115
    -35, 115
points:
    60, 115
    180, 115
speed: 50
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.03

[screws_tilt_adjust]
screw1: 70, 40
screw1_name: Front Left
screw2: 225, 40
screw2_name: Front Right
screw3: 225, 200
screw3_name: Rear Right
screw4: 70, 200
screw4_name: Rear Left
horizontal_move_z: 10
speed: 80
screw_thread: CW-M4

[idle_timeout]
timeout: 14400
gcode:
    M84

# ======================================================================
# MACROS
# ======================================================================

[gcode_macro T0]
description: Ignore T0 toolchange command from slicer
gcode:

[gcode_macro M300]
description: Play tone using onboard beeper
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    {% if S > 0 %}
        SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S }
        G4 P{P}
        SET_PIN PIN=beeper VALUE=0
    {% else %}
        G4 P{P}
    {% endif %}

[gcode_macro M600]
description: Filament change pause macro
gcode:
    PAUSE
    M300 S1000 P300
